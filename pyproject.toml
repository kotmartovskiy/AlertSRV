[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alertsrv"
version = "0.1.0"
description = "Local-first alert aggregation core for LAN Discovery"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"

[tool.setuptools.packages.find]
include = ["alertsrv*"]
